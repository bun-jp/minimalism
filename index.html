<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a10">
<title>MINIMALISM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<style>
:root{--line:#d8d8d8;--dim:#7a7a82;--faint:#2c2c30;
  --font:-apple-system,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  --mono:'SF Mono',Menlo,Consolas,'Noto Sans Mono CJK KR','Noto Sans KR',monospace}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--line);font-family:var(--font);overscroll-behavior:none}
body{display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;background:#000;overflow:hidden;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);position:relative}

/* ---- 상단 화면 ---- */
#stage{position:relative;width:100%;aspect-ratio:4/3;flex:0 0 auto;background:#000;border-bottom:1px solid var(--faint);overflow:hidden}
#stage.doc{aspect-ratio:auto;flex:0 1 46dvh;min-height:0}
#stage.doc.tall{flex:1 1 0}
#stage.doc ~ #controls{flex:1 1 0;max-height:none;min-height:0}
#stage.doc.tall ~ #controls{flex:0 0 auto}
#art{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#stage.doc #art{display:none}
#hud{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:3}
#hud button{height:28px;padding:0 10px;font-size:12px;font-family:var(--font);letter-spacing:.06em;color:#cfcfcf;background:rgba(0,0,0,.72);
  border:1px solid #55555a;cursor:pointer;line-height:1}
#hud button:active{background:#e8e8e8;color:#000}
#flash{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:2}

/* ---- 문서 패널 (전부 모노톤) ---- */
#doc{display:none;position:absolute;inset:0;overflow:auto;padding:48px 14px 20px;font-family:var(--mono);font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;-webkit-overflow-scrolling:touch}
#stage.doc #doc{display:block}
#doc.paper{background:#d4d2cb;color:#14141a}
#doc.postit{background:#c9c7bf;color:#14141a;font-size:14px}
#doc.mail{background:#e4e4e4;color:#14141a}
#doc.phone{background:#0a0a0c;color:#d0d0d4}
#doc.term{background:#040404;color:#c4c4c8}
#stage.doc.more::after{content:'▼';position:absolute;left:0;right:0;bottom:0;height:36px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:12px;color:#fff;background:linear-gradient(to top,rgba(0,0,0,.6),transparent);pointer-events:none;z-index:2}
#doc .hl{color:#d12c2c;font-weight:bold}
#doc .bd{font-weight:bold}
#doc hr{border:0;border-top:1px dashed currentColor;opacity:.4;margin:8px 0}

/* ---- 수첩(개인정보) ---- */
#stage.doc #doc.memo{display:flex;background:#050505;padding:20px 18px}
.nb{position:relative;width:100%;max-width:330px;margin:auto;transform:rotate(-1.4deg);filter:drop-shadow(0 12px 20px rgba(0,0,0,.95))}
.nb-page{background-color:#d6d2c6;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,rgba(70,68,60,.38) 31px,rgba(70,68,60,.38) 32px);
  padding:34px 16px 26px 46px;border-left:2px solid rgba(60,58,54,.6);min-height:330px}
.nb-body{font-family:'Nanum Pen Script','Gaegu','Segoe Print',cursive;font-size:28px;line-height:32px;color:#17171f;white-space:pre-wrap;
  transform:rotate(.4deg)}
.nb-tag{position:absolute;top:9px;right:14px;font:10px var(--mono);color:#6d6b63;letter-spacing:.16em}
.nb-holes{position:absolute;left:11px;top:16px;bottom:16px;width:14px;z-index:1;
  background:radial-gradient(circle at 7px 7px,#050505 0 5px,transparent 5.6px) 0 0/14px 58px repeat-y}

/* ---- 해설집 ---- */
#doc.guide{background:#050505;color:#d6d6d6;font-family:var(--font);font-size:14.5px;line-height:1.95;padding:48px 22px 48px;white-space:normal}
#doc.guide .g-title{font-size:21px;letter-spacing:.22em;color:#fff}
#doc.guide .g-sub{font-size:11px;color:#7a7a82;letter-spacing:.16em;margin:2px 0 26px}
#doc.guide .g-h{margin:30px 0 12px;padding-top:14px;border-top:1px solid #2c2c30;font-size:12px;letter-spacing:.18em;color:#9a9aa2}
#doc.guide p{margin-bottom:12px}
#doc.guide p.tight{margin-bottom:3px}
#doc.guide p.li{padding-left:1.1em;text-indent:-1.1em}
#doc.guide p.cur{color:#fff}
#doc.guide p.cur::before{content:'▶ 이번 엔딩  ';color:#c9a45e;font-size:12px;letter-spacing:.06em}
#stage.doc.tall ~ #dialog:empty{display:none}

/* ---- 대사 ---- */
#dialog{flex:1 1 0;min-height:70px;padding:16px 18px;font-size:15px;line-height:1.85;letter-spacing:.01em;white-space:pre-line;overflow:auto;
  background:#000;color:#cfcfcf;word-break:keep-all;-webkit-overflow-scrolling:touch}
#stage.doc ~ #dialog{flex:0 0 auto;max-height:24%;min-height:60px}
#dialog.sys{color:#f0f0f0;letter-spacing:.03em}
#dialog .cur::after{content:'▌';animation:bl 1s steps(2) infinite;color:var(--dim)}
@keyframes bl{50%{opacity:0}}

/* ---- 조작부 ---- */
#controls{flex:0 0 auto;max-height:46%;overflow:auto;padding:10px 14px 16px;display:flex;flex-direction:column;gap:8px;background:#000;border-top:1px solid var(--faint)}
.btn{font-family:var(--font);font-size:15px;line-height:1.4;color:#d8d8d8;background:transparent;border:1px solid #4a4a50;
  padding:13px 14px;min-height:48px;text-align:left;cursor:pointer;letter-spacing:.01em;transition:background .08s,color .08s}
.btn:active{background:#e8e8e8;color:#000;border-color:#e8e8e8}
.btn.sub{border-color:#2a2a2e;color:#7a7a82;font-size:14px}
.btn.accent{border-color:#e8e8e8;color:#fff}
.btn.ghost{border:0;background:transparent;color:#8d8d95;font-size:13px;min-height:38px;padding:8px;text-align:center;
  text-decoration:underline;text-underline-offset:5px;text-decoration-color:#4a4a50;letter-spacing:.04em}
.btn.ghost:active{background:transparent;color:#fff}
@keyframes hintPulse{0%,100%{border-color:#4a4a50}50%{border-color:#c9a45e}}
.btn.hint{animation:hintPulse 1.8s ease-in-out infinite}
.row{display:flex;gap:8px}
.row .btn{flex:1;text-align:center}
.txt{font-family:var(--font);font-size:17px;color:var(--line);background:#000;border:1px solid #4a4a50;padding:12px;width:100%;outline:none;letter-spacing:.04em;border-radius:0}
.txt:focus{border-color:#e8e8e8}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad .btn{text-align:center;font-size:19px;padding:6px 0;min-height:42px}
.disp{font-size:22px;letter-spacing:10px;text-align:center;padding:6px;border:1px solid #3a3a40;background:#000;min-height:44px;color:#fff}
.dirdisp{font-size:20px;text-align:center;padding:10px;border:1px solid #3a3a40;background:#000;min-height:52px;color:#fff;letter-spacing:2px;overflow-x:auto;white-space:nowrap}
.dir{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dir .btn{text-align:center;font-size:22px;padding:4px 0;min-height:44px}
.endlabel{color:#fff;text-align:center;font-size:13px;letter-spacing:.14em;padding:6px 0}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* ---- 타이틀 화면 ---- */
#app.title-mode #stage{aspect-ratio:auto;flex:1 1 0;min-height:0;border-bottom:0}
#app.title-mode #dialog{display:none}
#app.title-mode #controls{max-height:none;border-top:0;padding:6px 14px 22px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="art"></canvas>
    <div id="doc"></div>
    <div id="flash"></div>
    <div id="hud">
      <button id="btnInv" aria-label="소지품" hidden>소지품 <span id="invCount">0</span></button>
      <button id="btnRestart" aria-label="처음부터" hidden>↺</button>
    </div>
  </div>
  <div id="dialog"></div>
  <div id="controls"></div>
</div>

function routeScreen(highlight){
  r(0,0,W,72,'#08080c');rect(0,0,W,72,C.grey2);rect(1,1,W-2,70,C.grey3);
  const cs=10;
  [['A',3],['B',34],['C',65]].forEach(([k,x])=>{
    const rt=ROUTES[k],dim=highlight&&k!=='A',lab=dim?C.grey3:C.white;
    const cells=rt.pts.map(p=>[(p[0]-20)/10,(p[1]-42)/10]);
    const xs=cells.map(c=>c[0]),ys=cells.map(c=>c[1]);
    const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
    const pw=28,ph=38,px0=x,py0=23;
    r(px0,12,pw,9,'#000');rect(px0,12,pw,9,lab);txt(k,px0+3,14,lab);txt(rt.min,px0+10,14,lab);          // 라벨 + 소요 시간
    r(px0,py0,pw,ph,'#101016');rect(px0,py0,pw,ph,dim?'#242430':C.grey2);
    const ox=px0+Math.round((pw-(maxx-minx)*cs)/2)-minx*cs,oy=py0+Math.round((ph-(maxy-miny)*cs)/2)-miny*cs;
    for(let gx=minx-1;gx<=maxx+1;gx++)for(let gy=miny-1;gy<=maxy+1;gy++){                          // 격자(한 칸 = 한 스텝)
      const X=ox+gx*cs,Y=oy+gy*cs;if(X>px0+1&&X<px0+pw-2&&Y>py0+1&&Y<py0+ph-2)px(X,Y,dim?'#2a2a34':'#5a5a68')}
    const col=dim?'#454545':'#fff';
    for(let i=0;i<cells.length-1;i++){
      const a=cells[i],b=cells[i+1];
      if(a[1]===b[1])r(ox+Math.min(a[0],b[0])*cs,oy+a[1]*cs,Math.abs(a[0]-b[0])*cs+1,2,col);
      else r(ox+a[0]*cs,oy+Math.min(a[1],b[1])*cs,2,Math.abs(a[1]-b[1])*cs+1,col);
      const n=Math.max(Math.abs(a[0]-b[0]),Math.abs(a[1]-b[1]));
      for(let s=0;s<=n;s++){const nx=a[0]+Math.sign(b[0]-a[0])*s,ny=a[1]+Math.sign(b[1]-a[1])*s;r(ox+nx*cs-1,oy+ny*cs-1,4,4,col)}   // 스텝마다 점
    }
    const S0=cells[0],D0=cells[cells.length-1];
    rect(ox+S0[0]*cs-4,oy+S0[1]*cs-4,10,10,dim?'#555':C.white);                                     // 출발: 네모
    ring(ox+D0[0]*cs+1,oy+D0[1]*cs+1,5,dim?'#454545':C.white,2);                                    // 도착: 원
  });
  clock(66,63,C.white);
}

  const N=60;
  for(let i=0;i<N;i++){

/* ---- 렌더 파이프라인 ----
   아트(192x144) → 블록 뭉개기(후반부) → 비네팅 → 블러 → Atkinson 디더링(1비트) → 잉크 색으로 출력 */
let artName='black',artTick=0,artExtra={},invertUntil=0,artHint=null;
function postBlocks(level){                       // 진행될수록 묘사가 줄어든다
  const b=(level>=0.8?2:1)*S;if(b<=S)return;
  const w=sc.width,h=sc.height,im=g.getImageData(0,0,w,h),d=im.data;
  for(let by=0;by<h;by+=b)for(let bx=0;bx<w;bx+=b){
    let R=0,G=0,B=0,n=0;
    for(let y=by;y<by+b&&y<h;y++)for(let x=bx;x<bx+b&&x<w;x++){const i=(y*w+x)*4;R+=d[i];G+=d[i+1];B+=d[i+2];n++}
    R/=n;G/=n;B/=n;
    for(let y=by;y<by+b&&y<h;y++)for(let x=bx;x<bx+b&&x<w;x++){const i=(y*w+x)*4;d[i]=R;d[i+1]=G;d[i+2]=B}
  }
  g.putImageData(im,0,0);
}
function vignette(level){
  const w=sc.width,h=sc.height;
  const gr=g.createRadialGradient(w/2,h/2,Math.min(w,h)*.18,w/2,h/2,Math.hypot(w,h)*.5);
  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,'+(0.6+0.25*level).toFixed(2)+')');
  g.fillStyle=gr;g.fillRect(0,0,w,h);
}
function inkFor(level){
  if(artName==='window')return[196,42,30];                                   // 붉은 하늘
  if(artName==='doorAnim'&&artExtra.frame>=1&&artExtra.frame<=3)return[210,36,26];   // 문 밖은 붉다
  if(artName==='title')return[232,232,232];
  const a=[236,226,204],b=[236,240,246];                                      // 일상(따뜻한 흰색) → 차가운 흰색
  return a.map((v,i)=>Math.round(v+(b[i]-v)*level));
}
const LIFT={office:.1,gate:.15,gateOpen:.15,elevatorIn:.2,elevatorOpen:.12,store:.12,counter:.1,shelf:.05,watch:.05};   // 어두운 장면만 밝기 보정
let lumA=null,lumB=null,lumO=null,outImg=null;
function ditherOut(level){
  const w=sc.width,h=sc.height,n=w*h,d=g.getImageData(0,0,w,h).data;
  if(!lumA||lumA.length!==n){lumA=new Float32Array(n);lumB=new Float32Array(n);lumO=new Float32Array(n)}
  const A=lumA,B=lumB;
  for(let i=0;i<n;i++){const j=i*4;A[i]=(0.299*d[j]+0.587*d[j+1]+0.114*d[j+2])/255}
  lumO.set(A);
  for(let y=0;y<h;y++){const o=y*w;for(let x=0;x<w;x++){B[o+x]=(A[o+(x>0?x-1:x)]+2*A[o+x]+A[o+(x<w-1?x+1:x)])/4}}      // 가로 블러
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){A[y*w+x]=((B[(y>0?y-1:y)*w+x]+2*B[y*w+x]+B[(y<h-1?y+1:y)*w+x])/4)*.5+lumO[y*w+x]*.5}   // 세로 블러(원본과 절반씩)
  const gamma=.8+.15*level,gain=1.4,ctr=1.1+.3*level,lift=LIFT[artName]||0;
  for(let i=0;i<n;i++){let v=A[i]>.03?A[i]+lift:A[i];v=Math.pow(v,gamma)*gain;v=(v-.5)*ctr+.5;A[i]=Math.max(0,Math.min(1,v))*255}
  if(level>=.85){const amp=6*level;for(let i=0;i<n;i++)A[i]+=(Math.random()-.5)*amp}                                   // 필름 그레인
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){                                                                            // Atkinson
    const i=y*w+x,old=A[i],nv=old>127.5?255:0;A[i]=nv;const e=(old-nv)/8;
    if(x+1<w)A[i+1]+=e;if(x+2<w)A[i+2]+=e;
    if(y+1<h){if(x>0)A[i+w-1]+=e;A[i+w]+=e;if(x+1<w)A[i+w+1]+=e}
    if(y+2<h)A[i+2*w]+=e;
  }
  let ink=inkFor(level),bg=[4,4,6];
  if(performance.now()<invertUntil){const t=ink;ink=bg;bg=t}
  if(!outImg||outImg.width!==w||outImg.height!==h)outImg=out.createImageData(w,h);
  const od=outImg.data;
  for(let i=0;i<n;i++){const c=A[i]>127?ink:bg,j=i*4;od[j]=c[0];od[j+1]=c[1];od[j+2]=c[2];od[j+3]=255}
  out.putImageData(outImg,0,0);
}
function glitch(level){
  if(level<.5&&performance.now()>=invertUntil)return;
  if(Math.random()>.12+.35*level)return;
  const w=cv.width,h=cv.height,n=1+((Math.random()*2)|0);
  for(let k=0;k<n;k++){const y=(Math.random()*h)|0,hh=Math.min(2+((Math.random()*10)|0),h-y),dx=((Math.random()*16)|0)-8;out.drawImage(cv,0,y,w,hh,dx,y,w,hh)}
}
function hexLum(c){if(typeof c!=='string'||c[0]!=='#')return 1;let h=c.slice(1);if(h.length===3)h=h.replace(/./g,m=>m+m);
  const n=parseInt(h,16);return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))/255}
function drawHint(){                                                  // 지금 봐야 할 곳을 은은하게 깜박이는 앰버색 모서리
  if(!artHint||artTick%3===2)return;
  const [x,y,w,h]=artHint.map(v=>Math.round(v*S)),L=Math.round(5*S);
  out.fillStyle='rgba(255,210,122,.10)';out.fillRect(x,y,w,h);
  out.fillStyle='#ffd27a';
  out.fillRect(x,y,L,2);out.fillRect(x,y,2,L);out.fillRect(x+w-L,y,L,2);out.fillRect(x+w-2,y,2,L);
  out.fillRect(x,y+h-2,L,2);out.fillRect(x,y+h-L,2,L);out.fillRect(x+w-L,y+h-2,L,2);out.fillRect(x+w-2,y+h-L,2,L);
}
function drawCrisp(level){
  drawHint();
  const inv=performance.now()<invertUntil;let ink=inkFor(level),bg=[4,4,6];if(inv){const t=ink;ink=bg;bg=t}
  const css=a=>'rgb('+a[0]+','+a[1]+','+a[2]+')';
  crisp.forEach(({s,x,y,c,sc})=>{
    const L=hexLum(c);let fg,halo=false;
    if(L>=.5){fg=css(ink);halo=true}                                   // 밝은 글자: 잉크색 + 검은 테두리
    else if(L>=.2){fg='rgb('+ink.map(v=>Math.round(v*.4)).join(',')+')'}   // 흐린 글자
    else fg=css(bg);                                                   // 어두운 글자
    const cell=Math.max(1,Math.round(sc*S));let cx=Math.round(x*S);const cy=Math.round(y*S);
    for(const pass of(halo?[0,1]:[1])){
      let X=cx;
      for(const ch of s){const p=FONT[ch];
        if(p)for(let i=0;i<15;i++)if(p[i]==='1'){
          const px0=X+(i%3)*cell,py0=cy+((i/3)|0)*cell;
          if(pass===0){out.fillStyle=css(bg);out.fillRect(px0-1,py0-1,cell+2,cell+2)}
          else{out.fillStyle=fg;out.fillRect(px0,py0,cell,cell)}
        }
        X+=4*cell}
    }
  });
}
function drawArt(){
  const fn=ART[artName]||ART.black,lvl=artName==='title'?.3:(game.tone||0);
  crisp=[];
  g.setTransform(S,0,0,S,0,0);g.imageSmoothingEnabled=false;
  fn(artTick,artExtra);
  g.setTransform(1,0,0,1,0,0);
  if(artName!=='title'&&artName!=='eyeEnding')postBlocks(lvl);
  vignette(lvl);
  ditherOut(lvl);
  glitch(artName==='title'?.55:lvl);
  if(artName==='eyeEnding'){
    const [ox,oy]=pupilOffset(artTick);
    const rx=(48+ox)*S,ry=(34+oy)*S,rr=4*S*1.3;
    const rg=out.createRadialGradient(rx,ry,0,rx,ry,rr);
    rg.addColorStop(0,'rgba(205,25,20,0.9)');
    rg.addColorStop(0.5,'rgba(150,12,10,0.5)');
    rg.addColorStop(1,'rgba(150,12,10,0)');
    out.fillStyle=rg;
    out.beginPath();out.arc(rx,ry,rr,0,Math.PI*2);out.fill();
  }
  drawCrisp(lvl);
  if(artName==='title'){                                   // 제목은 작고 선명하게 (디더링을 거치지 않음)
    const Hc=sc.height/S,cy=Math.round(Hc*.4),cell=2,pitch=6,word='MINIMALISM';
    const x0=Math.round((cv.width-(word.length*pitch-1)*cell)/2),y0=(cy+26)*S;
    out.fillStyle='#e8e8e8';

  }
}

function dedent(s){
  const L=s.replace(/\r/g,'').split('\n');
  while(L.length&&!L[0].trim())L.shift();while(L.length&&!L[L.length-1].trim())L.pop();
  const ind=Math.min(...L.filter(l=>l.trim()).map(l=>l.match(/^ */)[0].length));
  return L.map(l=>l.slice(ind)).join('\n');
}
function cleanDialog(s){return (s||'').replace(/\r/g,'').split('\n').map(l=>l.trim()).join('\n').replace(/\n{3,}/g,'\n\n').trim()}

  ['이 일에','이 \u0003일\u0004에'],['고객사','고객\u0003사\u0004'],['최소 십 분','최소 \u0003십\u0004 분']]};
function addMarked(parent,line){
  let cls=null,buf='';
  const flush=()=>{if(!buf)return;if(cls){parent.appendChild(mk('span',cls,buf))}else parent.appendChild(document.createTextNode(buf));buf=''};
  for(const ch of line){
    if(ch==='\u0001'){flush();cls='bd'}else if(ch==='\u0003'){flush();cls='hl'}
    else if(ch==='\u0002'||ch==='\u0004'){flush();cls=null}else buf+=ch;
  }
  flush();parent.appendChild(document.createTextNode('\n'));
}

/* ---- 비밀번호 입력 ---- */
const norm=s=>String(s).replace(/\s+/g,'').toUpperCase();
function buildKeypad(sc){
  const numeric=/^\d+$/.test(sc.answer);
  let val='';
  const check=()=>{
    if(norm(val)===norm(sc.answer)){
      if(sc.state)game.flags[sc.state]=1;
      else if(sc.success==='phoneUnlocked')game.flags.phoneState=1;   // 원본 버그 수정: 폰 잠금 해제 상태 저장
      go(sc.success);
    }else{
      ctrl.classList.remove('shake');void ctrl.offsetWidth;ctrl.classList.add('shake');
      later(()=>go(sc.fail),350);
    }
  };
  if(numeric){
    const masked=false;                                  // 입력한 숫자를 그대로 보여준다
    const disp=mk('div','disp','·'.repeat(0));
    const paint=()=>{disp.textContent=val?(masked?'●'.repeat(val.length):val):' ';};
    paint();ctrl.appendChild(disp);
    const pad=mk('div','pad');
    ['1','2','3','4','5','6','7','8','9','⌫','0','OK'].forEach(k=>{
      pad.appendChild(button(k,()=>{
        if(k==='⌫')val=val.slice(0,-1);
        else if(k==='OK')return check();
        else if(val.length<(sc.maxLength||20))val+=k;
        paint();
      },'btn'+(k==='OK'?' accent':'')));
    });
    ctrl.appendChild(pad);
  }else{
    const inp=mk('input','txt');inp.type='text';inp.maxLength=sc.maxLength||50;inp.placeholder=sc.placeholder||'';
    inp.autocomplete='off';inp.autocapitalize='off';inp.spellcheck=false;
    inp.addEventListener('input',()=>val=inp.value);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){val=inp.value;check()}});
    ctrl.appendChild(inp);
    ctrl.appendChild(button('확인',()=>{val=inp.value;check()},'btn accent'));
  }
}

/* ---- 방향 입력(문) ---- */
const ARROW={U:'↑',D:'↓',L:'←',R:'→'};
function buildDirPad(sc){
  const disp=mk('div','dirdisp','[ ]');
  const paint=()=>{disp.textContent='[ '+game.directionInput.map(x=>ARROW[x]).join(' ')+' ]'};
  ctrl.appendChild(disp);
  const grid=mk('div','dir');
  const add=(label,v)=>grid.appendChild(button(label,()=>{game.directionInput.push(v);paint()}));
  grid.appendChild(mk('span'));add('↑','U');grid.appendChild(mk('span'));
  add('←','L');add('↓','D');add('→','R');
  ctrl.appendChild(grid);
  const row=mk('div','row');
  row.appendChild(button('지우기',()=>{game.directionInput=[];paint()},'btn sub'));
  row.appendChild(button('확인',()=>{
    const ok=JSON.stringify(game.directionInput)===JSON.stringify(sc.answer);
    game.directionInput=[];
    if(ok)go('doorOpen');else{ctrl.classList.remove('shake');void ctrl.offsetWidth;ctrl.classList.add('shake');later(()=>go('directionFail'),350)}
  },'btn accent'));
  ctrl.appendChild(row);
}

/* ---- 문 열림 애니메이션 ---- */
function playDoorAnim(){
  hideDoc();ctrl.innerHTML='';setDialog('');locked=true;
  let f=0;setArt('doorAnim',{frame:0});
  const step=()=>{f++;if(f>4){later(()=>go('taxiRide'),900);return}setArt('doorAnim',{frame:f});later(step,700)};
  later(step,700);
}

/* ---- 컷신(택시) ---- */
function playCutscene(name,sc){
  hideDoc();let i=0;
  const show=()=>{
    setArt('taxi',{stage:i});setDialog(sc.dialogs[i]);
    ctrl.innerHTML='';
    ctrl.appendChild(button((sc.buttons&&sc.buttons[i]||'다음').trim(),()=>{
      i++;if(i>=sc.frames.length){go(sc.next)}else show();
    },'btn'));
  };
  show();
}

function showCommentary(endName){
  clearTimers();
  btnInv.hidden=true;setArt('black');
  stage.classList.add('doc','tall');docEl.className='guide';docEl.textContent='';
  docEl.appendChild(mk('div','g-title','해설집'));docEl.appendChild(mk('div','g-sub','MINIMALISM'));
  COMMENTARY.forEach(sec=>{
    docEl.appendChild(mk('div','g-h',sec.h));
    sec.p.forEach(x=>{const o=typeof x==='string'?{t:x}:x;const cls=[o.end&&o.end===endName?'cur':'',o.tight?'tight':'',o.li?'li':''].filter(Boolean).join(' ');docEl.appendChild(mk('p',cls,o.t))});
  });
  docEl.scrollTop=0;
  const upd=()=>stage.classList.toggle('more',docEl.scrollHeight-docEl.scrollTop-docEl.clientHeight>6);
  docEl.onscroll=upd;upd();
  setDialog('');
  ctrl.innerHTML='';
  ctrl.appendChild(button('후기 남기기',()=>window.open('https://forms.gle/NozwrLzqj3hXRE7SA','_blank'),'btn'));
  ctrl.appendChild(button('처음부터 다시 하기',()=>go('__restart'),'btn accent'));
}
